<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Activity MN - By Nabeel</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<style>
body{font-family:sans-serif; background:#0f172a; color:white; text-align:center; padding:15px; margin:0}
.top-bar{display:flex; justify-content:space-between; align-items:center; max-width:500px; margin:0 auto}
.lang-btn{background:#334155; color:white; padding:6px 14px; border-radius:20px; border:none; cursor:pointer}
.card{background:white; color:black; padding:20px; border-radius:15px; max-width:480px; margin:15px auto; box-shadow:0 4px 10px rgba(0,0,0,0.3)}
input,button{width:90%; padding:12px; margin:8px; border-radius:8px; border:1px solid #ccc; font-size:16px}
button{background:#2563eb; color:white; border:none; font-weight:bold; cursor:pointer; transition:0.2s}
button:active, button.clicked{background:#facc15 !important; color:black !important; transform:scale(0.97)}
.social-links{display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin:12px auto; max-width:500px}
.social-links a{padding:10px 14px; border-radius:8px; text-decoration:none; color:white; font-weight:bold; font-size:14px}
.yt{background:#ff0000} .tk{background:#000000} .ig{background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)} .wa{background:#25D366}
#dashboard{display:none}
#storyText{line-height:1.7; font-size:15px; color:#334155; text-align:justify}
</style>
</head>
<body>

<div class="top-bar">
<h3 style="margin:0">AI Activity MN</h3>
<button class="lang-btn" onclick="toggleLang()" id="langBtn">اردو / EN</button>
</div>

<p id="welcomeText" style="max-width:500px; margin:10px auto; color:#cbd5e1;">Welcome to AI Activity MN - Your All-in-One AI Platform</p>

<!-- SOCIAL LINKS - APNE LINKS YAHAN DALO -->
<div class="social-links">
<a class="yt" href="https://youtube.com/@aiactivity-mn?si=R_2jpQeu_JytFc_Y" target="_blank">YouTube</a>
<a class="tk" href="https://tiktok.com/@YOUR_TIKTOK" target="_blank">TikTok</a>
<a class="ig" href="https://instagram.com/YOUR_INSTA" target="_blank">Instagram</a>
<a class="wa" href="https://whatsapp.com/channel/YOUR_WA_CHANNEL" target="_blank">WhatsApp</a>
</div>

<!-- LOGIN / SIGNUP CARD -->
<div class="card" id="loginCard">
<h3 id="formTitle">Login / Signup</h3>
<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">
<button onclick="handleClick(this, signup())" id="signupBtn">Signup</button>
<button onclick="handleClick(this, login())" id="loginBtn">Login</button>
<p id="msg" style="color:#dc2626; font-weight:bold; min-height:20px;"></p>
<p id="infoText" style="font-size:12px; color:#64748b;">Signup ke baad Email par OTP/Link jayega</p>
</div>

<!-- DASHBOARD - SIRF WELCOME + DAILY STORY -->
<div id="dashboard">
  <div class="card">
    <h1 id="welcomeOnly" style="margin:0; color:#16a34a;">Welcome</h1>
    <p id="userEmail" style="color:#64748b;"></p>
    <button onclick="logout()" style="background:#475569; width:auto; padding:8px 20px;">Logout</button>
  </div>

  <!-- DAILY AI STORY -->
  <div class="card" style="text-align:left;">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3 style="margin:0">📖 <span id="storyHead">Daily AI Story</span></h3>
      <span id="storyDate" style="font-size:11px; background:#e0e7ff; padding:4px 8px; border-radius:10px; color:#3730a3;"></span>
    </div>
    <h4 id="storyTitle" style="color:#2563eb; margin:12px 0 8px 0;"></h4>
    <p id="storyText"></p>
    <div style="display:flex; gap:8px; margin-top:12px;">
      <button onclick="readStory('en')" style="background:#10b981; width:50%; font-size:13px;">🔊 English Suno</button>
      <button onclick="readStory('ur')" style="background:#f59e0b; width:50%; font-size:13px;">🔊 اردو سنو</button>
    </div>
    <div style="display:flex; gap:8px; margin-top:8px;">
      <button onclick="generateNewStory()" style="background:#6366f1; font-size:13px;">✨ Nayi Kahani</button>
      <button onclick="stopReading()" style="background:#ef4444; font-size:13px;">⏹️ Stop</button>
    </div>
  </div>

  <div class="card">
    <h3>🔥 AI Tools</h3>
    <p style="color:#64748b;">More AI Tools Coming Soon...</p>
    <button style="background:#0f172a;">AI Image Generator</button>
    <button style="background:#0f172a;">AI Chat</button>
  </div>

  <!-- ADS CONTAINER -->
  <div id="container-68cb5ce35f8f0c2fe98c12e69b11af8f"></div>
</div>

<script>
// LANGUAGE TOGGLE
let isUrdu = false;
function toggleLang(){
  isUrdu = !isUrdu;
  if(isUrdu){
    document.getElementById('welcomeText').innerText = "AI Activity MN میں خوش آمدید - آپ کا مکمل AI پلیٹ فارم";
    document.getElementById('formTitle').innerText = "لاگ ان / سائن اپ";
    document.getElementById('welcomeOnly').innerText = "خوش آمدید";
    document.getElementById('storyHead').innerText = "روزانہ AI کہانی";
    document.getElementById('infoText').innerText = "سائن اپ کے بعد ای میل پر OTP/لنک جائے گا";
  } else {
    document.getElementById('welcomeText').innerText = "Welcome to AI Activity MN - Your All-in-One AI Platform";
    document.getElementById('formTitle').innerText = "Login / Signup";
    document.getElementById('welcomeOnly').innerText = "Welcome";
    document.getElementById('storyHead').innerText = "Daily AI Story";
    document.getElementById('infoText').innerText = "After Signup, OTP/Link will be sent to Email";
  }
  loadDailyStory();
}
function handleClick(btn, func){ btn.classList.add('clicked'); setTimeout(()=>btn.classList.remove('clicked'),400); return func; }

// FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyCXsUAl9wbLBPRsNUDH_Z-p2aH7S9AY2w4",
  authDomain: "ai-activity-mn.firebaseapp.com",
  projectId: "ai-activity-mn",
  storageBucket: "ai-activity-mn.firebasestorage.app",
  messagingSenderId: "1077514836371",
  appId: "1:1077514836371:web:ba9a873a0f48b337277066"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

// DAILY AI STORIES
const stories = [
  { title: {en:"The Robot Who Learned to Dream", ur:"وہ روبوٹ جس نے خواب دیکھنا سیکھا"}, text: {en:"In 2040, a robot named NOVA worked in a library. Every night he watched kids read. He started dreaming of dragons and castles. He learned even robots can imagine. Moral: Dreams make everyone special.", ur:"2040 میں NOVA نامی روبوٹ لائبریری میں کام کرتا تھا۔ ہر رات بچوں کو کتابیں پڑھتے دیکھتا تھا۔ اس نے ڈریگن اور قلعوں کے خواب دیکھنا شروع کر دیے۔ اس نے سیکھا کہ روبوٹ بھی تخیل رکھ سکتے ہیں۔ سبق: خواب سب کو خاص بناتے ہیں۔"}},
  { title: {en:"The Smart Village", ur:"سمارٹ گاؤں"}, text: {en:"Nabeel's village had lights that listened to voice. People called it magic, but it was AI. When it stopped, Nabeel fixed it and taught everyone. Now it's Pakistan's smartest village.", ur:"نبیل کے گاؤں میں روشنیاں آواز سنتی تھیں۔ لوگ اسے جادو کہتے تھے لیکن یہ AI تھی۔ جب یہ بند ہوئی تو نبیل نے اسے ٹھیک کیا اور سب کو سکھایا۔ اب یہ پاکستان کا سب سے سمارٹ گاؤں ہے۔"}},
  { title: {en:"The Cat and the Drone", ur:"بلی اور ڈرون"}, text: {en:"A girl lost her cat. She used AI drone to find it on a roof. Technology with love does wonders.", ur:"ایک بچی کی بلی گم ہو گئی۔ اس نے AI ڈرون سے اسے چھت پر ڈھونڈ لیا۔ محبت کے ساتھ ٹیکنالوجی حیرت انگیز کام کرتی ہے۔"}},
  { title: {en:"AI Teacher", ur:"AI استاد"}, text: {en:"An AI teacher taught kids in mountains where no teacher could go. Kids learned English, Math and Dreams.", ur:"ایک AI استاد نے پہاڑوں میں بچوں کو پڑھایا جہاں کوئی استاد نہیں جا سکتا تھا۔ بچوں نے انگریزی، ریاضی اور خواب سیکھے۔"}}
];
let currentStoryIndex = new Date().getDate() % stories.length;
function loadDailyStory(){
  const s = stories[currentStoryIndex];
  document.getElementById('storyDate').innerText = new Date().toLocaleDateString();
  document.getElementById('storyTitle').innerText = isUrdu ? s.title.ur : s.title.en;
  document.getElementById('storyText').innerText = isUrdu ? s.text.ur : s.text.en;
}
function generateNewStory(){ currentStoryIndex = (currentStoryIndex+1)%stories.length; loadDailyStory(); }
function readStory(lang){
  stopReading();
  const s = stories[currentStoryIndex];
  const text = lang==='ur' ? s.text.ur : s.text.en;
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = lang==='ur' ? 'ur-PK' : 'en-US'; utter.rate=0.9;
  window.speechSynthesis.speak(utter);
}
function stopReading(){ window.speechSynthesis.cancel(); }

// AUTH LOGIC
auth.onAuthStateChanged((user) => {
  if (user) {
    if(user.emailVerified){
      document.getElementById('loginCard').style.display='none';
      document.getElementById('dashboard').style.display='block';
      document.getElementById('userEmail').innerText=user.email;
      loadDailyStory();
    } else {
      document.getElementById('msg').innerText="Email par OTP Link bhej diya hai! Inbox/Spam check karo aur verify karo!";
    }
  } else {
    document.getElementById('loginCard').style.display='block';
    document.getElementById('dashboard').style.display='none';
  }
});
function signup(){
  let e=document.getElementById('email').value.trim();
  let p=document.getElementById('password').value.trim();
  if(!e || !p){ document.getElementById('msg').innerText="Email/Password likho!"; return; }
  auth.createUserWithEmailAndPassword(e,p)
  .then((cred)=>{ cred.user.sendEmailVerification().then(()=>{ document.getElementById('msg').innerText="OTP Email bhej diya! Email check karo! ✅"; document.getElementById('msg').style.color="green"; }); })
  .catch((err)=>{ document.getElementById('msg').innerText=err.message; document.getElementById('msg').style.color="red"; });
}
function login(){
  let e=document.getElementById('email').value.trim();
  let p=document.getElementById('password').value.trim();
  auth.signInWithEmailAndPassword(e,p)
  .then((cred)=>{ if(!cred.user.emailVerified){ document.getElementById('msg').innerText="Pehle Email OTP Verify karo!"; auth.signOut(); } })
  .catch((err)=>{ document.getElementById('msg').innerText=err.message; });
}
function logout(){ stopReading(); auth.signOut(); }
</script>
